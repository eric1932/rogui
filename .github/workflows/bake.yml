# 手动触发：把 rogui 的 ROG 网页做进 KoolCenter 固件，产出一个自带 ROG 网页的 .pkgtb。
#
# 固件文件不进仓库：先在电脑上跑 rogui/ci.sh run，它把两个固件传到草稿 Release「inputs」（草稿只有对仓库有
# 写权限的人看得到），再触发这里。产物放进 Release「rogui-<KoolCenter 版本>-<重新打包日期>」：
# - 默认是草稿；
# - 仓库变量 ROGUI_RELEASE=public，或者触发时选 public，才发布成公开 Release。公开 Release 谁都能下载，
#   等于公开分发华硕和 KoolCenter 的固件，要不要这样做自己决定。
# 重新打包日期按仓库变量 ROGUI_TZ 的时区算（例如 America/Los_Angeles），没设就用 UTC。
# 精简（build.py --slim）：默认删掉用不到的文件，语言只留 EN、CN、TW。仓库变量 ROGUI_SLIM 改模块
# （例如 lang,unused 或 none），ROGUI_LANGS 改留下的语言（例如 EN,CN,TW,DE）。
name: bake

on:
  workflow_dispatch:
    inputs:
      kc:
        description: 草稿 Release「inputs」里 KoolCenter 固件的文件名（.pkgtb）
        required: true
      stock:
        description: 同一个草稿里华硕原厂固件的文件名（FW_GT-BE98_Pro_*.zip）
        required: true
      release:
        description: 产物发布成公开 Release 还是草稿。default 按仓库变量 ROGUI_RELEASE，没设就是草稿
        type: choice
        options: [default, draft, public]
        default: default

permissions:
  contents: write

concurrency:
  group: bake

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      KC: ${{ inputs.kc }}
      STOCK: ${{ inputs.stock }}
      ROGUI_RELEASE: ${{ (inputs.release != 'default' && inputs.release) || vars.ROGUI_RELEASE || 'draft' }}
      ROGUI_TZ: ${{ vars.ROGUI_TZ || 'UTC' }}
      ROGUI_SLIM: ${{ vars.ROGUI_SLIM }}
      ROGUI_LANGS: ${{ vars.ROGUI_LANGS }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 squashfs-tools，定重新打包日期
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          mksquashfs -version | head -1
          echo "REPACK_DATE=$(TZ="$ROGUI_TZ" date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "产物发布方式: $ROGUI_RELEASE"

      - name: 从草稿 Release 取固件
        run: bash rogui/ci.sh fetch "$KC" "$STOCK" in

      - name: 打补丁包（update.sh：拼补丁 + 静态检查）
        run: bash rogui/update.sh "in/$KC" "in/$STOCK"

      - name: 做进固件并逐项对比（bake.sh）
        run: |
          pkg="$(ls rogui/dist/rogui-*.tgz)"
          sudo REPACK_DATE="$REPACK_DATE" bash rogui/bake.sh "in/$KC" "$pkg" out

      - name: 产物放进 Release
        run: bash rogui/ci.sh publish out rogui/dist/rogui-*.tgz rogui/dist/rogui-*.check.txt

      - name: 摘要
        if: always()
        run: |
          {
            echo '### bake'
            echo '```'
            cat out/*.verify.txt rogui/dist/failed/*.txt out/failed/*.txt 2>/dev/null || echo '（没有报告）'
            cat out/*.sha256 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
