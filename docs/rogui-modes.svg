<svg xmlns="http://www.w3.org/2000/svg" width="680" height="704" viewBox="0 0 680 704" role="img">
<title>rogui 的两种方案</title>
<desc>KoolCenter 梅林改版和华硕原厂固件在电脑上合并成补丁包，然后有两种装法：挂载版不刷机，开机时盖到 /www 上；固件版把网页做进固件刷一次。两种方案出来的网页完全相同。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#2C2C2A;stroke:#5F5E5A}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#F1EFE8}.c-gray>.ts{fill:#D3D1C7}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">KoolCenter 梅林改版</text><text class="ts" x="190" y="78" text-anchor="middle" dominant-baseline="central">Merlin 功能 + 软件中心，界面是蓝色</text></g>
<g class="c-gray"><rect x="360" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="490" y="58" text-anchor="middle" dominant-baseline="central">华硕原厂固件</text><text class="ts" x="490" y="78" text-anchor="middle" dominant-baseline="central">有 ROG 网页，没有软件中心</text></g>
<path d="M190 96 V116 H290 V134" class="arr" marker-end="url(#arrow)"/>
<path d="M490 96 V116 H390 V134" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="170" y="136" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">rogui 在你的电脑上合并</text><text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">只取两边的网页层，生成补丁包，不碰路由器</text></g>
<path d="M340 192 V211 H185 V228" class="arr" marker-end="url(#arrow)"/>
<path d="M340 192 V211 H495 V228" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="230" width="290" height="292" rx="12" stroke-width="0.5"/>
<text class="th" x="185" y="256" text-anchor="middle" dominant-baseline="central">挂载版（overlay）</text>
<text class="ts" x="185" y="276" text-anchor="middle" dominant-baseline="central">不刷机，开机时盖到 /www 上</text>
<text class="ts" x="60" y="312" dominant-baseline="central">jffs 占用</text><text class="th" x="310" y="312" text-anchor="end" dominant-baseline="central">约 13MB</text>
<text class="ts" x="60" y="346" dominant-baseline="central">内存</text><text class="th" x="310" y="346" text-anchor="end" dominant-baseline="central">约 45MB</text>
<text class="ts" x="60" y="380" dominant-baseline="central">开机时间</text><text class="th" x="310" y="380" text-anchor="end" dominant-baseline="central">多约 2 秒</text>
<text class="ts" x="60" y="414" dominant-baseline="central">换固件时</text><text class="th" x="310" y="414" text-anchor="end" dominant-baseline="central">重新打包，再部署</text>
<text class="ts" x="60" y="448" dominant-baseline="central">怎么撤回</text><text class="th" x="310" y="448" text-anchor="end" dominant-baseline="central">一条命令，马上撤</text>
<text class="ts" x="60" y="482" dominant-baseline="central">适合</text><text class="th" x="310" y="482" text-anchor="end" dominant-baseline="central">先试试，要能随时撤</text>
</g>
<g class="c-teal"><rect x="350" y="230" width="290" height="292" rx="12" stroke-width="0.5"/>
<text class="th" x="495" y="256" text-anchor="middle" dominant-baseline="central">固件版（baked）</text>
<text class="ts" x="495" y="276" text-anchor="middle" dominant-baseline="central">刷一次自制固件，网页做在固件里</text>
<text class="ts" x="370" y="312" dominant-baseline="central">jffs 占用</text><text class="th" x="620" y="312" text-anchor="end" dominant-baseline="central">不到 10KB</text>
<text class="ts" x="370" y="346" dominant-baseline="central">内存</text><text class="th" x="620" y="346" text-anchor="end" dominant-baseline="central">不额外占</text>
<text class="ts" x="370" y="380" dominant-baseline="central">开机时间</text><text class="th" x="620" y="380" text-anchor="end" dominant-baseline="central">不变</text>
<text class="ts" x="370" y="414" dominant-baseline="central">换固件时</text><text class="th" x="620" y="414" text-anchor="end" dominant-baseline="central">重新打包，做固件，刷机</text>
<text class="ts" x="370" y="448" dominant-baseline="central">怎么撤回</text><text class="th" x="620" y="448" text-anchor="end" dominant-baseline="central">刷回原版固件</text>
<text class="ts" x="370" y="482" dominant-baseline="central">适合</text><text class="th" x="620" y="482" text-anchor="end" dominant-baseline="central">长期用，固件很少换</text>
</g>
<line x1="185" y1="522" x2="185" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="522" x2="495" y2="546" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="548" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="566" text-anchor="middle" dominant-baseline="central">两种装法，出来的网页逐字节相同</text><text class="ts" x="340" y="586" text-anchor="middle" dominant-baseline="central">原厂 ROG 界面 + Merlin 页面（VPN Director 等）+ KoolCenter 软件中心</text></g>
<rect class="box" x="40" y="628" width="137" height="56" rx="8" stroke-width="0.5"/><text class="th" x="108" y="646" text-anchor="middle" dominant-baseline="central">只换网页层</text><text class="ts" x="108" y="666" text-anchor="middle" dominant-baseline="central">httpd、rc 都不动</text>
<rect class="box" x="194" y="628" width="137" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="646" text-anchor="middle" dominant-baseline="central">逐项验证</text><text class="ts" x="262" y="666" text-anchor="middle" dominant-baseline="central">其余逐字节不变</text>
<rect class="box" x="348" y="628" width="137" height="56" rx="8" stroke-width="0.5"/><text class="th" x="416" y="646" text-anchor="middle" dominant-baseline="central">能复现</text><text class="ts" x="416" y="666" text-anchor="middle" dominant-baseline="central">本地和 CI 一致</text>
<rect class="box" x="502" y="628" width="137" height="56" rx="8" stroke-width="0.5"/><text class="th" x="570" y="646" text-anchor="middle" dominant-baseline="central">不分发固件</text><text class="ts" x="570" y="666" text-anchor="middle" dominant-baseline="central">用你自己的固件拼</text>
</svg>
